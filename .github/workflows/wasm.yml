name: Wasm

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']
  workflow_dispatch:

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip1

      - name: Build rs-search lib for wasm32-wasip1
        run: cargo build --release --target wasm32-wasip1 --no-default-features --features wasm --lib

      - name: List wasm artifacts
        run: |
          ls -la target/wasm32-wasip1/release/ || true
          find target/wasm32-wasip1/release -name '*.wasm' -o -name '*.rlib' | head -20

      - name: Upload rs-search wasm rlib
        uses: actions/upload-artifact@v4
        with:
          name: rs-search-wasm32-wasip1
          path: target/wasm32-wasip1/release/librs_search.rlib
          if-no-files-found: warn
