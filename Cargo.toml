[package]
name = "rs-search"
version = "0.1.0"
edition = "2021"

[lib]
name = "rs_search"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
default = []
wasm = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
