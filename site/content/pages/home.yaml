id: home
title: Home
hero:
  heading: "rs-search"
  subheading: "hybrid BM25 + vector codebase search over MCP"
  body: "hybrid BM25 + vector (nomic-embed-text-v1.5) code search with RRF fusion, PDF ingest, and per-call project_root over MCP. how gm finds \"where X happens\" without burning context."
  badges:
    - { label: "rust" }
    - { label: "bm25" }
    - { label: "vector" }
    - { label: "mcp" }
    - { label: "pdf" }
    - { label: "gm" }
  ctas:
    - { label: "GitHub", href: "https://github.com/AnEntrypoint/rs-search", primary: true }
    - { label: "Install", href: "https://github.com/AnEntrypoint/rs-search#installation" }
    - { label: "247420", href: "https://247420.xyz" }
features:
  heading: "Why rs-search"
  items:
    - { name: "hybrid ranking", desc: "BM25 + vector fused with reciprocal rank fusion (k=60); identifier queries get a 1.5x BM25 boost." }
    - { name: "nomic embeddings", desc: "nomic-embed-text-v1.5 GGUF via candle-core. lazy-loaded, mean-pooled, L2-normalized, SIMD cosine, MRL truncation." }
    - { name: "pdf ingest", desc: ".pdf is a first-class search target. pure-Rust pdf_extract splits on form-feed; hits render as doc.pdf:<page>." }
    - { name: "mcp server", desc: "stdio MCP with panic-safe tools/call. per-call project_root, index, and discipline resolution — one server, many roots." }
    - { name: "cli flags", desc: "--root, --index, --discipline override project root, index dir, and discipline at the CLI without touching env." }
    - { name: "content-addressable cache", desc: "BLAKE3-keyed embedding cache on disk; skips re-embedding unchanged chunks across runs." }
quickstart:
  heading: Quick start
  lines:
    - { kind: "cmt", text: "# install (nightly toolchain required)" }
    - { kind: "cmd", text: "cargo +nightly install --git https://github.com/AnEntrypoint/rs-search rs-search" }
    - { kind: "cmt", text: "" }
    - { kind: "cmt", text: "# one-shot search in current dir" }
    - { kind: "cmd", text: "rs-search search \"reciprocal rank fusion\"" }
    - { kind: "cmt", text: "" }
    - { kind: "cmt", text: "# explicit project root + index dir" }
    - { kind: "cmd", text: "rs-search --root ./repo --index ./.code-search search query" }
    - { kind: "cmt", text: "" }
    - { kind: "cmt", text: "# MCP stdio server" }
    - { kind: "cmd", text: "rs-search serve" }
